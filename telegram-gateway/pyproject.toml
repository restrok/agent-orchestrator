[project]
name = "telegram-gateway"
version = "0.1.0"
description = "Telegram Gateway for Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.26.0",
    "python-multipart>=0.0.7",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "PTH"]
ignore = [
    "E402", # Allow imports after environment setup
    "T201", # Allow print in CLI/scripts
    "E501", # Allow long lines
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
