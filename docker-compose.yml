version: '3.8'

services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: agent-orchestrator-whisper
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=faster_whisper
    networks:
      - default
      - shared_internal_network
    restart: unless-stopped

  orchestrator:
    build:
      context: ./orchestrator-api
      dockerfile: Dockerfile
    image: ghcr.io/restrok/agent-orchestrator/orchestrator-api:latest
    container_name: agent-orchestrator-api
    ports:
      -  8001:8001
    env_file:
      - ./orchestrator-api/.env
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./orchestrator-api/app:/app
      - orchestrator_data:/app/data
      - /home/fsirio/.ssh:/root/.ssh:ro
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    depends_on:
      - whisper
    networks:
      - default
      - shared_internal_network
    restart: unless-stopped

  gateway:
    build:
      context: ./telegram-gateway
      dockerfile: Dockerfile
    image: ghcr.io/restrok/agent-orchestrator/telegram-gateway:latest
    container_name: agent-orchestrator-gateway
    env_file:
      - ./telegram-gateway/.env
    depends_on:
      - orchestrator
    environment:
      - API_URL=http://orchestrator:8001
    volumes:
      - ./telegram-gateway:/app
    networks:
      - default
      - shared_internal_network
    restart: unless-stopped

networks:
  default:
  shared_internal_network:
    external: true

volumes:
  orchestrator_data:
