version: '3.8'

services:
  orchestrator:
    build:
      context: ./orchestrator-api
      dockerfile: Dockerfile
    image: ghcr.io/restrok/agent-orchestrator/orchestrator-api:latest
    container_name: agent-orchestrator-api
    ports:
      - "8001:8001"
    env_file:
      - ./orchestrator-api/.env
    volumes:
      - ./orchestrator-api/app:/app
      - orchestrator_data:/app/data
    restart: unless-stopped

  gateway:
    build:
      context: ./telegram-gateway
      dockerfile: Dockerfile
    image: ghcr.io/restrok/agent-orchestrator/telegram-gateway:latest
    container_name: agent-orchestrator-gateway
    env_file:
      - ./telegram-gateway/.env
    depends_on:
      - orchestrator
    environment:
      - API_URL=http://orchestrator:8001
    restart: unless-stopped

volumes:
  orchestrator_data:
